      default: 'false'
      value: 'false'
      help: If true, keep events with 0 hits
  components/GGTF_tracking.cpp:
    ModelPath:
      type: std::string
      default: '""'
      value: '""'
      help: Path to ONNX model
    Tbeta:
      type: double
      default: '0.6'
      value: '0.6'
      help: clustering beta threshold
    Td:
      type: double
      default: '0.3'
      value: '0.3'
      help: clustering distance threshold
    MaxHitsPerEvent:
      type: int
      default: '0'
      value: '0'
      help: Cap input hits per event (0=off)
    OnnxChunk:
      type: int
      default: '4096'
      value: '4096'
      help: Chunk size for ONNX inference
    DropWireIfAbsDTooLarge:
      type: bool
      default: 'true'
      value: 'true'
      help: Drop wire digi from GGTF processing if |d| > MaxAbsDMM
    MaxAbsDMM:
      type: double
      default: '30.0'
      value: '30.0'
      help: Maximum allowed |distanceToWire| [mm] before dropping (if enabled)
    ZeroMinSizeKeep:
      type: int
      default: '8'
      value: '8'
      help: Min hits for a label=0 group to be considered (else dropped)
    MinWireFracKeep:
      type: double
      default: '0.60'
      value: '0.60'
      help: Min fraction of wire hits to keep a zero-label group
    PromoteZeroIfGood:
      type: bool
      default: 'true'
      value: 'true'
      help: If a zero-label group passes checks, treat it as a normal cluster
    SkipZeroIfSmall:
      type: bool
      default: 'true'
      value: 'true'
      help: If label=0 group smaller than ZeroMinSizeKeep, drop it
    SkipZeroAlways:
      type: bool
      default: 'false'
      value: 'false'
      help: If true, never build tracks from label=0
    FilterInputWiresByTruthPdg:
      type: bool
      default: 'true'
      value: 'true'
      help: If true, exclude wire digis whose linked MCParticle PDG != KeepTruthPdg from GGTF processing.
    KeepTruthPdg:
      type: int
      default: '13'
      value: '13'
      help: PDG code to keep when FilterInputWiresByTruthPdg is enabled (default 13=mu).
    DropWireIfUnlinked:
      type: bool
      default: 'true'
      value: 'true'
      help: 'When filtering enabled: if a wire digi has no truth link, drop it (true) or keep it (false).'
    GeoSvcName:
      type: std::string
      default: '"GeoSvc"'
      value: '"GeoSvc"'
      help: GeoSvc name
    DchName:
      type: std::string
      default: '"DCH_v2"'
      value: '"DCH_v2"'
      help: Drift chamber detector name
    JobTag:
      type: std::string
      default: '""'
      value: '""'
      help: Optional free-form tag (e.g. steering script name, input file, run label) stored in metadata
  components/GenFit2DCHFitter.cpp:
    RejectNegativeLabels:
      type: bool
      default: 'true'
      value: 'true'
      help: Skip GGTF tracks with track.type < 0 (debug labels).
    MinHitsPerTrack:
      type: unsigned
      default: 8u
      value: 8u
      help: Minimum SenseWireHits per GGTF track to attempt fit (after pruning/dedup).
    MinMeasurementsToFit:
      type: unsigned
      default: 6u
      value: 6u
      help: Minimum WireMeasurementNew inserted into GenFit track to attempt fit.
    MinFittedPointsWithFI:
      type: unsigned
      default: 10u
      value: 10u
      help: Minimum number of TrackPoints with FitterInfo before accepting/publishing.
    SortHits:
      type: bool
      default: 'true'
      value: 'true'
      help: Sort SenseWireHits along PCA axis computed from on-wire positions.
    DeduplicateHits:
      type: bool
      default: 'true'
      value: 'true'
      help: Drop nearly-identical on-wire positions.
    DedupTolMM:
      type: double
      default: '0.05'
      value: '0.05'
      help: Dedup tolerance on on-wire XYZ distance (mm).
    PreFitOutlierVeto:
      type: bool
      default: 'true'
      value: 'true'
      help: Deterministic pre-fit outlier veto (circle-fit in XY + chord fallback).
    OutlierMaxDrop:
      type: unsigned
      default: 2u
      value: 2u
      help: Max number of hits to drop in pre-fit outlier veto.
    OutlierCircleResidualMM:
      type: double
      default: '8.0'
      value: '8.0'
      help: Drop worst hit if |r-R| exceeds this in circle-fit pruning (mm).
    OutlierChordResidualMM:
      type: double
      default: '20.0'
      value: '20.0'
      help: Fallback drop worst hit if chord-perp distance exceeds this (mm).
    OutlierMinKeep:
      type: unsigned
      default: 10u
      value: 10u
      help: Never prune below this number of hits.
    SeedEndpointK:
      type: unsigned
      default: 6u
      value: 6u
      help: Mean of first/last K hits (after sorting/pruning) used as seed endpoints.
    SeedTangentK:
      type: unsigned
      default: 10u
      value: 10u
      help: Window size for tangent estimation at each end (PCA direction over first/last K hits).
    UseKFPreFit:
      type: bool
      default: 'true'
      value: 'true'
      help: 'If true: run KalmanFitterRefTrack first as a prefit, then run DAF (if enabled).'
    UseDAF:
      type: bool
      default: 'true'
      value: 'true'
      help: 'If true: run DAF after prefit (recommended for wire left/right ambiguity).'
    FallbackToKFIfDAFFails:
      type: bool
      default: 'true'
      value: 'true'
      help: 'If true and UseDAF=true: if DAF throws/fails, keep KF result (if good).'
    KFMaxIters:
      type: unsigned
      default: 12u
      value: 12u
      help: KF max iterations.
    DAFMaxIters:
      type: unsigned
      default: 8u
      value: 8u
      help: DAF max iterations.
    TryBothMomentumDirections:
      type: bool
      default: 'true'
      value: 'true'
      help: Try mom0 and -mom0; keep best fit.
    Bz:
      type: double
      default: '2.0'
      value: '2.0'
      help: Bz field [T]
    PDG:
      type: int
      default: '13'
      value: '13'
      help: PDG hypothesis.
    UseBiasedStateForPublish:
      type: bool
      default: 'true'
      value: 'true'
      help: Use AbsFitterInfo::getFittedState(biased=true) for publishing. If false, use unbiased.
    PublishStateCentralFrac:
      type: double
      default: '0.60'
      value: '0.60'
      help: Fraction of track points (by index) to consider around the middle for publish-state selection.
    UseMaterialEffects:
      type: bool
      default: 'true'
      value: 'true'
      help: Use TGeoMaterialInterface for GenFit MaterialEffects
    TGeoFile:
      type: std::string
      default: '""'
      value: '""'
      help: Optional ROOT geometry file to import if gGeoManager is null (e.g. detector.root).
    TGeoTopVolume:
      type: std::string
      default: '""'
      value: '""'
      help: 'Optional: if importing, set a specific top volume name (usually leave empty).'
    DisableEnergyLoss:
      type: bool
